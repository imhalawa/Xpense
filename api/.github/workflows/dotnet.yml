name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

env:
  SOLUTION: src/Xpense/Xpense.sln

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore $SOLUTION
    - name: Build
      run: dotnet build $SOLUTION --no-restore
    - name: Test
      run: >
        dotnet test $SOLUTION --no-build
        --logger trx --results-directory TestResults
        --collect:"XPlat Code Coverage"
    - name: Coverage report
      if: ${{ !cancelled() }}
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        export PATH="$PATH:$HOME/.dotnet/tools"
        reportgenerator \
          -reports:'TestResults/**/coverage.cobertura.xml' \
          -targetdir:CoverageReport \
          -reporttypes:'MarkdownSummaryGithub;Html'
        cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Smoke-test the compose stack
      run: |
        cp .env.example .env
        sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-not-a-secret/' .env
        docker compose up -d --build
        curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4000/health
        test "$(docker inspect -f '{{.State.Running}}' xpense-notifications)" = "true"
        docker compose logs notifications --no-color | grep -q "Event pump started"
    - name: Compose logs
      if: ${{ !cancelled() }}
      run: docker compose logs --no-color
    - name: Tear down
      if: ${{ !cancelled() }}
      run: docker compose down -v

    - name: Upload dotnet test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-results
        path: TestResults
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: CoverageReport
