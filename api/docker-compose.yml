name: xpenseapi

x-connection: &connection "Host=postgres;Port=5432;Database=xpense;Username=xpense;Password=${POSTGRES_PASSWORD:?missing - copy .env.example to .env}"

services:
  postgres:
    build:
      context: docker/postgres
    image: xpense-postgres:local
    container_name: xpense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpense
      POSTGRES_USER: xpense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing - copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - xpense-postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpense -d xpense"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: docker/migrations/Dockerfile
    image: xpense-migrations:local
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--connection", *connection]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: xpense-api:local
    container_name: xpense-api
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: *connection
    ports:
      - "127.0.0.1:4000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  notifications:
    build:
      context: .
      dockerfile: docker/notifications/Dockerfile
    image: xpense-notifications:local
    container_name: xpense-notifications
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: *connection

volumes:
  xpense-postgres-data:
